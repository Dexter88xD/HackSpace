services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents host node_modules from shadowing the container's
    # Only browser-safe, VITE_-prefixed settings are provided to Vite.
    # Server credentials stay out of the frontend container.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    networks:
      - hackspace_network

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - hackspace_network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hackspace_network

  adminer:
    image: adminer:5.5.1
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - hackspace_network

  minio:
    # Immutable multi-platform pin; no floating tag or private version-tag access.
    image: cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set health http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
          && mc ready health
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - hackspace_network

volumes:
  db_data:
  minio_data:

networks:
  hackspace_network:
    driver: bridge
