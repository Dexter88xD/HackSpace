services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents host node_modules from shadowing the container's
    # Only browser-safe, VITE_-prefixed settings are provided to Vite.
    # Server credentials stay out of the frontend container.
    networks:
      - hackspace_network

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_started
      # minio:
      #   condition: service_started
    networks:
      - hackspace_network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hackspace_network

  adminer:
    image: adminer:5.5.1
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - hackspace_network

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST}
      BACKEND_HOST: ${BACKEND_HOST}
      FRONTEND_HOST: ${FRONTEND_HOST}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - hackspace_network

  # minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"   # API
  #     - "9001:9001"   # web console
  #   networks:
  #     - hackspace_network

volumes:
  db_data:
  caddy_data:
  # minio_data:

networks:
  hackspace_network:
    driver: bridge
