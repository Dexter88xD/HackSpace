services:

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # prevents host node_modules from shadowing the container's
    # Only browser-safe, VITE_-prefixed settings are provided to Vite.
    # Server credentials stay out of the frontend container.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    networks:
      - hackspace_network

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      # minio:
      #   condition: service_started
    networks:
      - hackspace_network

  ai_service:
    build:
      context: ./ai_service
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service:/app
    env_file:
      - .env
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - hackspace_network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hackspace_network

  adminer:
    image: adminer:5.5.1
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - hackspace_network

  # minio:
  #   image: quay.io/minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  #   volumes:
  #     - minio_data:/data
  #   ports:
  #     - "9000:9000"   # API
  #     - "9001:9001"   # web console
  #   networks:
  #     - hackspace_network

  broker:
    image: apache/kafka:4.3.1
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hackspace_network

  init-kafka:
    image: apache/kafka:4.3.1
    container_name: init-kafka
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - hackspace_network
    volumes:
      - ./infrastructure/scripts/kafka-init.sh:/kafka-init.sh
    command: bash /kafka-init.sh

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    ports:
      - "8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - hackspace_network


volumes:
  db_data:
  # minio_data:

networks:
  hackspace_network:
    driver: bridge