services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://localhost:8443}
      VITE_MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-10485760}
    volumes:
      - ./frontend:/app
      - /app/node_modules # prevents host node_modules from shadowing the container's
    # Only browser-safe, VITE_-prefixed settings are provided to Vite.
    # Server credentials stay out of the frontend container.
    networks:
      - hackspace_network

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Only application settings enter this container; MinIO root credentials stay out.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost:8443}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:8443}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost:8443/api/auth/oauth/google/callback}
      INTRA42_CLIENT_ID: ${INTRA42_CLIENT_ID:-}
      INTRA42_CLIENT_SECRET: ${INTRA42_CLIENT_SECRET:-}
      INTRA42_CALLBACK_URL: ${INTRA42_CALLBACK_URL:-https://localhost:8443/api/auth/oauth/42/callback}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://minio.localhost:8443}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MAX_FILE_UPLOAD_BYTES: ${MAX_FILE_UPLOAD_BYTES:-10485760}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      SEED_EXPECTED_DB: ${SEED_EXPECTED_DB:-transcendence}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks:
      - hackspace_network

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - hackspace_network

  adminer:
    image: adminer:5.5.1
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    networks:
      - hackspace_network

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      - frontend
      - backend
      - minio
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
      MINIO_API_DOMAIN: ${MINIO_API_DOMAIN:-minio.localhost}
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN:-console.minio.localhost}
      # Docker service addresses Caddy forwards to
      BACKEND_HOST: backend:3000
      FRONTEND_HOST: frontend:5173
      MINIO_API_HOST: minio:9000
      MINIO_CONSOLE_HOST: minio:9001
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - hackspace_network

  minio:
    # Immutable multi-platform pin; no floating tag or private version-tag access.
    image: &minio_image cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN:-console.minio.localhost}:8443
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mc alias set health http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
          && mc ready health
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - hackspace_network

  minio-init:
    image: *minio_image
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/provision/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - ./infrastructure/minio/init.sh:/provision/init.sh:ro
      - ./infrastructure/minio/backend-policy.json:/provision/backend-policy.json:ro
    networks:
      - hackspace_network

volumes:
  db_data:
  caddy_data:
  minio_data:

networks:
  hackspace_network:
    driver: bridge
