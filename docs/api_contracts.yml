openapi: 3.0.3
info:
  title: HackSpace API
  version: 0.2.0
  description: |
    HTTP API served under /api. The interactive Swagger UI is at /api/docs.
    Endpoint paths below are relative to /api. JSON property names use camelCase.
servers:
  - url: /api
security:
  - accessToken: []
paths:
  /skills:
    get:
      summary: List skills with an optional partial name filter
      description: Names are trimmed, whitespace is collapsed, and matching is case insensitive. Responses omit profile and user relations.
      parameters:
        - in: query
          name: name
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: All skills ordered by name and ID, or all skills containing the name when name is supplied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "401": { description: Authentication required }
    post:
      summary: Create or reuse a catalog skill, optionally attaching it to a profile
      description: Omit profileId to create or reuse an unassigned catalog skill. When profileId is supplied, profile existence and ownership/admin permission are checked before writing. A non-null ID takes precedence and must exist. When ID is null or omitted, reuse a normalized name or create a catalog skill. Repeated assignments succeed. Catalog creation and assignment are separate writes; if assignment fails, a newly created catalog skill may remain unassigned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSkill" }
      responses:
        "201":
          description: The attached skill without profile or user relations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { description: Invalid DTO }
        "401": { description: Authentication required }
        "403": { description: Profile owner or admin required }
        "404": { description: Profile or supplied skill ID not found }
  /skills/by-name:
    get:
      summary: Find one skill by exact normalized name
      description: Names are trimmed, whitespace is collapsed, and matching is case insensitive. Responses omit profile and user relations.
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: Skill without relations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { description: Missing or invalid name }
        "401": { description: Authentication required }
        "404": { description: Skill not found }
  /skills/batch:
    post:
      summary: Create or reuse a batch of skills, optionally attaching them to profiles
      description: Validates the entire DTO array before processing. Runs additions sequentially in input order and stops at the first error. Earlier successful additions remain committed; later entries are skipped. On success, returns one skill per DTO in input order, including repeated references. An error response does not include partial results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/AddSkill" }
      responses:
        "201":
          description: Skills corresponding to the input DTOs in input order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "400": { description: Invalid or empty DTO array }
        "401": { description: Authentication required }
        "403":
          { description: Profile owner or admin required for every profile }
        "404": { description: Profile or supplied skill ID not found }
  /skills/{id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      summary: Find skill by ID
      responses:
        "200":
          description: Skill without relations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { description: Invalid ID }
        "401": { description: Authentication required }
        "404": { description: Skill not found }
    patch:
      summary: Rename a shared catalog skill (admin only)
      description: Updates the display name and normalized name for all assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { description: Invalid ID or name }
        "401": { description: Authentication required }
        "403": { description: Admin required }
        "404": { description: Skill not found }
        "409": { description: Normalized name already exists }
    delete:
      summary: Delete a catalog skill and detach it from every profile (admin only)
      responses:
        "204": { description: Skill and assignments deleted }
        "400": { description: Invalid ID }
        "401": { description: Authentication required }
        "403": { description: Admin required }
        "404": { description: Skill not found }
  /skills/profiles/{profileId}:
    parameters:
      - in: path
        name: profileId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: List skills for an existing profile
      responses:
        "200":
          description: Skills ordered by name and ID; empty array for a profile with no skills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "400": { description: Invalid profile ID }
        "401": { description: Authentication required }
        "404": { description: Profile not found }
    delete:
      summary: Detach skills from a profile (profile owner or admin)
      description: Keeps catalog entries. Repeated detachment succeeds; nonexistent catalog IDs return 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [skillIds]
              properties:
                skillIds:
                  type: array
                  minItems: 1
                  items: { type: integer, minimum: 1 }
      responses:
        "204": { description: Assignments removed }
        "400": { description: Invalid profile ID or skill IDs }
        "401": { description: Authentication required }
        "403": { description: Profile owner or admin required }
        "404": { description: Profile or skill not found }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user and send an email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Verification email requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: Invalid input or mismatched passwords }
        "409": { description: Email or username already registered }
  /auth/verify:
    post:
      tags: [Authentication]
      summary: Verify email with an OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyInput" }
      responses:
        "201":
          description: Email verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: Invalid or expired OTP }
        "401": { description: Invalid verification request }
        "409": { description: Email already verified }
  /auth/resend-code:
    post:
      tags: [Authentication]
      summary: Resend the email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: Verification email requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { description: Invalid verification request }
        "409": { description: Email already verified }
  /auth/signin:
    post:
      tags: [Authentication]
      summary: Sign in with email or username and set an HttpOnly accessToken cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: Signed in; response sets accessToken cookie
          headers:
            Set-Cookie:
              description: HttpOnly accessToken cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { description: Invalid credentials or email not verified }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out by clearing the HttpOnly accessToken cookie
      description: Clears the browser authentication cookie. Does not revoke previously issued JWTs. Can be called without an active session.
      security: []
      responses:
        "201":
          description: Logged out; response expires the accessToken cookie
          headers:
            Set-Cookie:
              description: Expired HttpOnly accessToken cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Retrieve the authenticated user's safe public fields
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthenticatedUser" }
        "401": { description: Authentication required }
  /auth/oauth/{provider}:
    get:
      tags: [Authentication]
      summary: Begin Google or 42 OAuth authorisation
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302": { description: Redirect to OAuth provider and set state cookie }
        "503": { description: OAuth provider not configured }
  /auth/oauth/{provider}/callback:
    get:
      tags: [Authentication]
      summary: Handle OAuth callback and redirect to the frontend
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "302":
          {
            description: Redirect to frontend,
            setting accessToken cookie on success,
          }
  /users/me/profile:
    get:
      tags: [Profiles]
      summary: Read the authenticated user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { description: Authentication required }
        "404": { description: Profile not found }
    post:
      tags: [Profiles]
      summary: Create the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "201":
          description: Created profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { description: Authentication required }
        "404": { description: User not found }
        "409": { description: Profile already exists }
    patch:
      tags: [Profiles]
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { description: Authentication required }
        "404": { description: Profile not found }
  /hackathons:
    get:
      tags: [Hackathons]
      summary: List and filter hackathons
      parameters:
        - $ref: "#/components/parameters/HackathonFiltersSearch"
        - $ref: "#/components/parameters/HackathonFiltersPhase"
        - $ref: "#/components/parameters/HackathonFiltersStartDate"
        - $ref: "#/components/parameters/HackathonFiltersEndDate"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated hackathons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HackathonList" }
        "400": { description: Invalid filter }
        "401": { description: Authentication required }
    post:
      tags: [Hackathons]
      summary: Create hackathon and assign the creator as ORGANIZER
      description: Requires exactly five ordered, consecutive lifecycle phases covering the entire hackathon duration. Each phase must have a positive duration, with no gaps or overlaps. The first phase starts when the hackathon begins, and the final phase ends when the hackathon ends. Creation is transactional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HackathonInput" }
      responses:
        "201":
          description: Created hackathon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HackathonWithSettings" }
        "400":
          {
            description: Invalid input,
            missing or duplicate phases,
            invalid dates,
            gaps,
            overlaps or misaligned hackathon boundaries,
          }
        "401": { description: Authentication required }
  /hackathons/mine:
    get:
      tags: [Hackathons]
      summary: List hackathons organised by the current user
      description: Applies the authenticated user's ORGANIZER membership; global administrator role does not by itself expand this endpoint.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated organised hackathons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HackathonList" }
        "401": { description: Authentication required }
  /hackathons/{id}:
    parameters:
      - $ref: "#/components/parameters/HackathonId"
    get:
      tags: [Hackathons]
      summary: Retrieve hackathon details and caller's canEdit flag
      responses:
        "200":
          description: Hackathon details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HackathonDetails" }
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
    patch:
      tags: [Hackathons]
      summary: Edit as hackathon ORGANIZER or platform ROLE_ADMIN
      description: Parent fields are optional. When phases is omitted, the existing schedule is preserved; when provided, it contains one to five distinct, fully specified phase entries. The service merges those entries with stored phases and validates the full five-phase schedule before saving transactionally. Settings may be partially updated; omitted settings values remain unchanged. Reducing maxTeamMembers is rejected if an existing team exceeds the proposed maximum. Increasing minTeamMembers does not invalidate existing teams; the minimum is checked when a team submits its project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HackathonUpdate" }
      responses:
        "200":
          description: Updated hackathon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HackathonWithSettings" }
        "400":
          {
            description: Empty or invalid update; duplicate phases,
            invalid dates,
            gaps,
            overlaps or misaligned hackathon boundaries,
          }
        "401": { description: Authentication required }
        "403": { description: Organiser or platform administrator required }
        "404": { description: Hackathon or settings not found }
        "409":
          {
            description: Proposed maximum team size is below an existing team's current membership count,
          }
  /hackathons/{id}/current-phase:
    parameters:
      - $ref: "#/components/parameters/HackathonId"
    get:
      tags: [Hackathons]
      summary: Get active phase, or null when there is no active phase
      responses:
        "200":
          description: Active phase object or JSON null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HackathonPhase"
                nullable: true
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
  /hackathons/{id}/membership:
    parameters:
      - $ref: "#/components/parameters/HackathonId"
    get:
      tags: [Hackathons]
      summary: Get the caller's registration status and hackathon role
      responses:
        "200":
          description: Membership status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
  /hackathons/{id}/register:
    parameters:
      - $ref: "#/components/parameters/HackathonId"
    post:
      tags: [Hackathons]
      summary: Register during the active registration phase
      responses:
        "201":
          description: Registered as participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationResult" }
        "400": { description: Registration period not active }
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
        "409": { description: Already registered }
  /hackathons/{id}/unregister:
    parameters:
      - $ref: "#/components/parameters/HackathonId"
    delete:
      tags: [Hackathons]
      summary: Unregister a PARTICIPANT during the active registration phase
      responses:
        "200":
          description: Unregistered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: Registration period not active }
        "401": { description: Authentication required }
        "403": { description: Only participants may unregister }
        "404": { description: Hackathon not found }
        "409": { description: User was not registered }
  /hackathons/{hackathonId}/teams:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    get:
      tags: [Teams]
      summary: List teams in a hackathon
      responses:
        "200":
          description: Team summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeamSummary" }
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
    post:
      tags: [Teams]
      summary: Create a team as an eligible registered participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Created team with its first member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { description: Hackathon has ended or invalid input }
        "401": { description: Authentication required }
        "403": { description: Participant membership required }
        "404": { description: Hackathon not found }
        "409": { description: Team name already taken or membership conflict }
  /hackathons/{hackathonId}/teams/me:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    get:
      tags: [Teams]
      summary: Get the caller's team, or null if not in a team
      responses:
        "200":
          description: Current team wrapper
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTeam" }
        "401": { description: Authentication required }
        "404": { description: Hackathon not found }
  /teams/{id}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Teams]
      summary: Get a team with its members
      responses:
        "200":
          description: Team details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { description: Authentication required }
        "404": { description: Team not found }
  /teams/{id}/join:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      tags: [Teams]
      summary: Join an eligible team as a registered participant
      responses:
        "201":
          description: Team details after join
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { description: Hackathon has ended }
        "401": { description: Authentication required }
        "403": { description: Participant membership required }
        "404": { description: Team not found }
        "409": { description: Team full or registration/team conflict }
  /teams/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    delete:
      tags: [Teams]
      summary: Leave a team
      responses:
        "200":
          description: Left the team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { description: Hackathon has ended }
        "401": { description: Authentication required }
        "404": { description: Team membership not found }
  /chat-rooms/{chatRoomId}/messages:
    parameters:
      - in: path
        name: chatRoomId
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Chat]
      summary: List persisted messages for a chat room
      description: Returns messages in ascending sentAt order. The authenticated user must be a member of the chat room.
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
        "400": { description: Invalid chat room ID }
        "401": { description: Authentication required }
        "403": { description: Chat room membership required }
  /hackathons/{hackathonId}/judges:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    post:
      tags:
        - Jury
      summary: Assign judge
      description:
        Organiser or platform administrator. Rejected at or after evaluation start when that phase exists. Target
        must have no existing hackathon membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignJudge"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignedJudge"
        "401":
          description: Authentication required
        "400":
          description: Invalid input or assignment closed
        "403":
          description: Management permission required
        "404":
          description: Hackathon or user not found
        "409":
          description: Existing hackathon membership
    get:
      tags:
        - Jury
      summary: List judges
      description: Any authenticated user; ordered by membership ID.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HackathonJudge"
        "401":
          description: Authentication required
        "404":
          description: Hackathon not found
  /hackathons/{hackathonId}/criteria:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    post:
      tags:
        - Jury
      summary: Create scoring criterion
      description:
        Organiser or platform administrator during active LAUNCH or REGISTRATION only. Title is trimmed and must
        remain non-empty; exact title must be unique within hackathon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScoringCriterion"
      responses:
        "201":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringCriterion"
        "401":
          description: Authentication required
        "400":
          description: Invalid input or criteria creation closed
        "403":
          description: Management permission required
        "404":
          description: Hackathon not found
        "409":
          description: Duplicate criterion title
    get:
      tags:
        - Jury
      summary: List scoring criteria
      description: Any authenticated user; ordered by criterion ID.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoringCriterion"
        "401":
          description: Authentication required
        "404":
          description: Hackathon not found
  /hackathons/{hackathonId}/jury/teams:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    get:
      tags:
        - Jury
      summary: List eligible jury teams
      description:
        Assigned judge during active EVALUATION (start inclusive, end exclusive). Only finalised submissions, ordered
        by team ID; progress is specific to requester. Completion requires at least one criterion and all criteria scored.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JuryEligibleTeam"
        "401":
          description: Authentication required
        "400":
          description: Evaluation is not open
        "403":
          description: Assigned judge required
        "404":
          description: Hackathon not found
  /hackathons/{hackathonId}/teams/{teamId}/scores:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      tags:
        - Jury
      summary: Upsert personal team scores
      description:
        Assigned judge during active EVALUATION only; finalised team in same hackathon. Partial updates allowed;
        criterion IDs must be distinct and belong to hackathon. Transactional upsert returns full personal evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTeamScores"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEvaluation"
        "401":
          description: Authentication required
        "400":
          description: Invalid scores, duplicate or foreign criteria, unfinalised submission or evaluation closed
        "403":
          description: Assigned judge required
        "404":
          description: Hackathon or team not found
  /hackathons/{hackathonId}/teams/{teamId}/scores/me:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Jury
      summary: Read personal team scores
      description:
        Assigned judge; finalised team in same hackathon. No evaluation phase restriction. All criteria ordered by
        ID, with null score and comment if not scored.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamEvaluation"
        "401":
          description: Authentication required
        "400":
          description: Submission not finalised
        "403":
          description: Assigned judge required
        "404":
          description: Hackathon or team not found
  /hackathons/{hackathonId}/rankings:
    parameters:
      - $ref: "#/components/parameters/HackathonIdNamed"
    get:
      tags:
        - Jury
      summary: Get hackathon rankings
      description:
        Before evaluation ends, organiser or platform administrator only; afterwards any authenticated user. Finalised
        teams only. Average each complete judge evaluation across all criteria, then average complete evaluations equally. Partial
        evaluations excluded. Sort by unrounded average descending then team ID ascending; sequential ranks, displayed average
        rounded to two decimals. Teams without complete evaluations sort last by ID with null rank and average.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamRanking"
        "401":
          description: Authentication required
        "403":
          description: Rankings not available to requester yet
        "404":
          description: Hackathon not found
  /teams/{teamId}/submission:
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Teams
      summary: Read submission state
      description:
        Team member, or assigned judge of the same hackathon during active EVALUATION for a finalised submission.
        Judge access is read-only.
      responses:
        "200":
          description: Submission state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JuryReadableSubmission"
        "401":
          description: Authentication required
        "403":
          description: Submission access denied
        "404":
          description: Team not found
  /teams/{teamId}/submission/files/{fileId}:
    parameters:
      - in: path
        name: teamId
        required: true
        schema:
          type: integer
          minimum: 1
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Teams
      summary: Download submission file
      description:
        Team member, or assigned judge of the same hackathon during active EVALUATION for a finalised submission.
        Judge access is read-only.
      responses:
        "200":
          description: Submission file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "403":
          description: Submission access denied
        "404":
          description: Team or file not found
components:
  securitySchemes:
    accessToken:
      type: apiKey
      in: cookie
      name: accessToken
  parameters:
    SkillId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    OAuthProvider:
      in: path
      name: provider
      required: true
      schema: { type: string, enum: [google, "42"] }
    HackathonId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    HackathonIdNamed:
      in: path
      name: hackathonId
      required: true
      schema: { type: integer, minimum: 1 }
    TeamId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    HackathonFiltersSearch:
      in: query
      name: search
      schema: { type: string }
    HackathonFiltersPhase:
      in: query
      name: phase
      schema: { $ref: "#/components/schemas/PhaseName" }
    HackathonFiltersStartDate:
      in: query
      name: startDate
      schema: { type: string, format: date-time }
    HackathonFiltersEndDate:
      in: query
      name: endDate
      schema: { type: string, format: date-time }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ChatMessage:
      type: object
      required: [id, content, sentAt, sender]
      properties:
        id: { type: integer }
        content: { type: string, maxLength: 4000 }
        sentAt: { type: string, format: date-time }
        sender:
          type: object
          required: [id, username]
          properties:
            id: { type: integer }
            username: { type: string }
    RegisterInput:
      type: object
      required: [username, fullName, email, password, confirmPassword]
      properties:
        username: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        confirmPassword: { type: string, format: password }
    VerifyInput:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string }
    AuthenticatedUser:
      type: object
      required: [id, username, fullName, role, email, emailVerified]
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [ROLE_USER, ROLE_ADMIN] }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
    ProfileInput:
      type: object
      additionalProperties: false
      description: All properties optional; avatarUrl accepts a valid URL when supplied.
      properties:
        bio: { type: string, maxLength: 500 }
        avatarUrl: { type: string, format: uri }
        organizationName: { type: string, maxLength: 100 }
        major: { type: string, maxLength: 100 }
    Profile:
      type: object
      required: [id, bio, avatarUrl, organizationName, major]
      properties:
        id: { type: integer }
        bio: { type: string, nullable: true }
        avatarUrl: { type: string, format: uri, nullable: true }
        organizationName: { type: string, nullable: true }
        major: { type: string, nullable: true }
    PhaseName:
      type: string
      enum: [LAUNCH, REGISTRATION, IN_PROGRESS, EVALUATION, FINISHED]
    HackathonRole:
      type: string
      enum: [ORGANIZER, PARTICIPANT, JURY, MENTOR]
    HackathonPhaseInput:
      type: object
      additionalProperties: false
      required: [phaseName, startAt, endAt]
      properties:
        phaseName: { $ref: "#/components/schemas/PhaseName" }
        description:
          {
            type: string,
            nullable: true,
            description: "Optional; defaults to null on creation. On update, omit to preserve the existing description, or send null to clear it.",
          }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    HackathonSettingsInput:
      type: object
      additionalProperties: false
      description: "Optional settings fields. Omitted values use defaults on create (minTeamMembers 1, maxTeamMembers 5, filesLimit 1, fileMaxSize 10485760 bytes), or retain saved values on update. Minimum must not exceed maximum. Changes to file limits do not delete existing uploaded files; new uploads and replacements must comply with current limits. Submission-time enforcement is handled by the submission feature."
      properties:
        minTeamMembers:
          {
            type: integer,
            minimum: 1,
            description: "Minimum team size required at project submission.",
          }
        maxTeamMembers:
          {
            type: integer,
            minimum: 1,
            description: "Maximum allowed team membership; cannot be reduced below an existing team's size.",
          }
        filesLimit:
          {
            type: integer,
            minimum: 1,
            maximum: 2147483647,
            description: "Maximum submission file count; at least one file may be uploaded.",
          }
        fileMaxSize:
          {
            type: integer,
            minimum: 1,
            maximum: 2147483647,
            description: "Maximum size per uploaded file, in bytes; the frontend displays MiB.",
          }
    HackathonSettings:
      type: object
      additionalProperties: false
      required: [id, minTeamMembers, maxTeamMembers, filesLimit, fileMaxSize]
      properties:
        id: { type: integer }
        minTeamMembers: { type: integer, minimum: 1 }
        maxTeamMembers: { type: integer, minimum: 1 }
        filesLimit: { type: integer, minimum: 1, maximum: 2147483647 }
        fileMaxSize:
          {
            type: integer,
            minimum: 1,
            maximum: 2147483647,
            description: "Bytes",
          }
    HackathonInput:
      type: object
      additionalProperties: false
      required: [title, organizationName, startAt, endAt, phases]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        organizationName: { type: string, minLength: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/HackathonSettingsInput" }
        phases:
          type: array
          minItems: 5
          maxItems: 5
          description: "Exactly one of each phase in order: LAUNCH, REGISTRATION, IN_PROGRESS, EVALUATION, FINISHED. Every phase must have a positive duration. The first phase must start when the hackathon starts, each subsequent phase must start exactly when the preceding phase ends, and the final phase must end when the hackathon ends. Gaps and overlaps are not allowed."
          items: { $ref: "#/components/schemas/HackathonPhaseInput" }
    HackathonUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        organizationName: { type: string, minLength: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        settings: { $ref: "#/components/schemas/HackathonSettingsInput" }
        phases:
          type: array
          minItems: 1
          maxItems: 5
          description: "Optional partial schedule update. Supply only changed phases, with distinct phaseName values; all five phases are validated after merging with saved phases."
          items: { $ref: "#/components/schemas/HackathonPhaseInput" }
    Hackathon:
      type: object
      required:
        [
          id,
          title,
          description,
          organizationName,
          startAt,
          endAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        organizationName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        phases:
          type: array
          description: "Included on create and update responses; collection/list responses may omit phases."
          items: { $ref: "#/components/schemas/HackathonPhase" }
    HackathonWithSettings:
      allOf:
        - $ref: "#/components/schemas/Hackathon"
        - type: object
          required: [settings]
          properties:
            settings: { $ref: "#/components/schemas/HackathonSettings" }
    HackathonDetails:
      allOf:
        - $ref: "#/components/schemas/HackathonWithSettings"
        - type: object
          required: [canEdit, phases]
          properties:
            canEdit: { type: boolean }
            phases:
              type: array
              minItems: 5
              maxItems: 5
              items: { $ref: "#/components/schemas/HackathonPhase" }
    HackathonList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Hackathon" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
    HackathonPhase:
      type: object
      required: [id, phaseName, description, startAt, endAt]
      properties:
        id: { type: integer }
        phaseName: { $ref: "#/components/schemas/PhaseName" }
        description: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    Membership:
      type: object
      required: [isRegistered, role]
      properties:
        isRegistered: { type: boolean }
        role:
          type: string
          enum: [ORGANIZER, PARTICIPANT, JURY, MENTOR]
          nullable: true
    RegistrationResult:
      type: object
      required: [message, data]
      properties:
        message: { type: string }
        data:
          type: object
          required: [hackathonId, userId, role]
          properties:
            hackathonId: { type: integer }
            userId: { type: integer }
            role: { $ref: "#/components/schemas/HackathonRole" }
    TeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, maxLength: 500, nullable: true }
    TeamSummary:
      type: object
      required: [id, name, description, memberCount, maxMembers]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        memberCount: { type: integer, minimum: 0 }
        maxMembers: { type: integer }
    TeamMember:
      type: object
      required: [userId, username, fullName, joinedAt]
      properties:
        userId: { type: integer }
        username: { type: string }
        fullName: { type: string }
        joinedAt: { type: string, format: date-time }
    Team:
      type: object
      required:
        [
          id,
          name,
          description,
          createdAt,
          hackathonId,
          minMembers,
          maxMembers,
          members,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        hackathonId: { type: integer }
        minMembers: { type: integer }
        maxMembers: { type: integer }
        members:
          type: array
          items: { $ref: "#/components/schemas/TeamMember" }
    MyTeam:
      type: object
      required: [team]
      properties:
        team:
          allOf:
            - $ref: "#/components/schemas/Team"
          nullable: true
    Skill:
      type: object
      required: [id, name, normalizedName]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 50 }
        normalizedName: { type: string, maxLength: 50 }
    AddSkill:
      type: object
      additionalProperties: false
      description: Names are trimmed, whitespace is collapsed, and both display and lowercase normalized names must contain 1 to 50 characters. A supplied name is validated even when ID takes precedence. profileId is optional; if supplied, it must be a positive integer and cannot be null.
      properties:
        profileId: { type: integer, minimum: 1, maximum: 9007199254740991 }
        id:
          {
            type: integer,
            minimum: 1,
            maximum: 9007199254740991,
            nullable: true,
          }
        name: { type: string, minLength: 1, maxLength: 50 }
      anyOf:
        - required: [id]
          properties:
            id: { type: integer, minimum: 1, nullable: false }
        - required: [name]
          properties:
            id: { type: integer, nullable: true, enum: [null] }
    AssignJudge:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          minimum: 1
      additionalProperties: false
    AssignedJudge:
      type: object
      required:
        - id
        - userId
        - hackathonId
        - role
      properties:
        id:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
        hackathonId:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
            - JURY
    HackathonJudge:
      type: object
      required:
        - id
        - userId
        - username
      properties:
        id:
          type: integer
          minimum: 1
        userId:
          type: integer
          minimum: 1
        username:
          type: string
    CreateScoringCriterion:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
      additionalProperties: false
    ScoringCriterion:
      type: object
      required:
        - id
        - hackathonId
        - title
        - description
      properties:
        id:
          type: integer
          minimum: 1
        hackathonId:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
    CriterionScoreInput:
      type: object
      required:
        - criterionId
        - score
      properties:
        criterionId:
          type: integer
          minimum: 1
        score:
          type: integer
          minimum: 0
          maximum: 10
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: Omit to preserve existing feedback; null or whitespace-only clears it.
      additionalProperties: false
    UpsertTeamScores:
      type: object
      required:
        - scores
      properties:
        scores:
          type: array
          items:
            $ref: "#/components/schemas/CriterionScoreInput"
          minItems: 1
      additionalProperties: false
    CriterionScore:
      type: object
      required:
        - criterionId
        - title
        - score
        - comment
      properties:
        criterionId:
          type: integer
          minimum: 1
        title:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 10
          nullable: true
        comment:
          type: string
          nullable: true
    TeamEvaluation:
      type: object
      required:
        - hackathonId
        - teamId
        - judgeId
        - isComplete
        - scoredCount
        - totalCriteria
        - scores
      properties:
        hackathonId:
          type: integer
          minimum: 1
        teamId:
          type: integer
          minimum: 1
        judgeId:
          type: integer
          minimum: 1
          description: Hackathon membership ID, not user ID.
        isComplete:
          type: boolean
        scoredCount:
          type: integer
          minimum: 0
        totalCriteria:
          type: integer
          minimum: 0
        scores:
          type: array
          items:
            $ref: "#/components/schemas/CriterionScore"
    JuryEligibleTeam:
      type: object
      required:
        - teamId
        - teamName
        - submittedAt
        - scoredCount
        - totalCriteria
        - isComplete
      properties:
        teamId:
          type: integer
          minimum: 1
        teamName:
          type: string
        submittedAt:
          type: string
          format: date-time
        scoredCount:
          type: integer
          minimum: 0
        totalCriteria:
          type: integer
          minimum: 0
        isComplete:
          type: boolean
    TeamRanking:
      type: object
      required:
        - rank
        - teamId
        - teamName
        - averageScore
        - completedEvaluations
        - status
      properties:
        rank:
          type: integer
          minimum: 1
          nullable: true
        teamId:
          type: integer
          minimum: 1
        teamName:
          type: string
        averageScore:
          type: number
          minimum: 0
          maximum: 10
          nullable: true
        completedEvaluations:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - EVALUATED
            - NOT_EVALUATED
    JuryReadableSubmission:
      type: object
      required:
        - submittedAt
        - isSubmitted
        - files
        - filesLimit
        - fileMaxSize
        - blocked
      properties:
        submittedAt:
          type: string
          format: date-time
          nullable: true
        isSubmitted:
          type: boolean
        files:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - fileType
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              fileType:
                type: string
        filesLimit:
          type: integer
          minimum: 0
        fileMaxSize:
          type: integer
          minimum: 0
        blocked:
          type: object
          required:
            - upload
            - delete
            - submit
            - unsubmit
          properties:
            upload:
              type: string
              nullable: true
            delete:
              type: string
              nullable: true
            submit:
              type: string
              nullable: true
            unsubmit:
              type: string
              nullable: true
